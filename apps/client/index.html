<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="Klinflow Client — Smart Waste Management for households" />
  <meta name="theme-color" content="#00A651" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Klinflow">
  <link rel="icon" type="image/webp" href="/resident-new.webp" />
  <link rel="apple-touch-icon" href="/resident-new.webp" />
  <link rel="preload" as="image" href="/welcome/loading.webp" fetchpriority="high" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #064e3b;
      font-family: 'Inter', system-ui, sans-serif;
    }

    #initial-loader {
      position: fixed;
      inset: 0;
      background: #064e3b;
      z-index: 999999;
      font-family: 'Inter', system-ui, sans-serif;
      overflow: hidden;
      opacity: 1;
      transition: opacity 0.35s ease-out;
    }

    @media all and (display-mode: standalone) {
      #initial-loader {
        display: none !important;
      }
    }

    .loader-bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
    }

    .loader-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.05) 0%, transparent 25%, transparent 75%, rgba(0, 0, 0, 0.12) 100%);
      pointer-events: none;
    }

    .loader-spinner-fixed {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .orbital-ring-outer {
      position: absolute;
      inset: 0;
      border-radius: 9999px;
      border: 2.5px solid rgba(255, 255, 255, 0.16);
      border-top-color: #ffffff;
      border-right-color: rgba(255, 255, 255, 0.7);
      animation: orbit-spin 0.95s cubic-bezier(0.55, 0.2, 0.35, 0.85) infinite;
    }

    .orbital-ring-inner {
      position: absolute;
      inset: 9px;
      border-radius: 9999px;
      border: 2px solid transparent;
      border-bottom-color: #6ee7b7;
      border-left-color: rgba(110, 231, 183, 0.5);
      animation: orbit-spin-reverse 1.35s linear infinite;
    }

    .orbital-core {
      width: 6px;
      height: 6px;
      border-radius: 9999px;
      background: #ffffff;
      box-shadow: 0 0 10px rgba(110, 231, 183, 0.9);
      animation: core-pulse 1.5s ease-in-out infinite;
    }

    .loader-bottom-content {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 16px) + 44px);
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 24px;
      gap: 6px;
    }

    .loader-status-text {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin: 0;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.4);
    }

    .loader-tagline {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.88);
      letter-spacing: 0.06em;
      margin: 0;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.45);
    }

    @keyframes orbit-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes orbit-spin-reverse {
      to {
        transform: rotate(-360deg);
      }
    }

    @keyframes core-pulse {
      0%, 100% {
        transform: scale(0.85);
        opacity: 0.7;
      }
      50% {
        transform: scale(1.25);
        opacity: 1;
      }
    }
  </style>
  <title>Klinflow Client</title>
</head>

<body class="font-sans antialiased bg-slate-50 text-slate-900 dark:bg-slate-800 dark:text-slate-100">
  <div id="initial-loader">
    <img src="/welcome/loading.webp" alt="Klinflow" class="loader-bg-image" fetchpriority="high" decoding="sync" />
    <div class="loader-scrim"></div>

    <div class="loader-spinner-fixed" aria-label="Loading">
      <div class="orbital-ring-outer"></div>
      <div class="orbital-ring-inner"></div>
      <div class="orbital-core"></div>
    </div>

    <div class="loader-bottom-content">
      <p class="loader-status-text">Loading</p>
      <p class="loader-tagline">Connect · Collect · Earn</p>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
