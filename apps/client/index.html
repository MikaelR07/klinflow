<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="Klinflow Client — Smart Waste Management for households" />
  <meta name="theme-color" content="#00A651" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Klinflow">
  <link rel="icon" type="image/webp" href="/resident-new.webp" />
  <link rel="apple-touch-icon" href="/resident-new.webp" />
  <link rel="preload" as="image" href="/welcome/loading.webp" fetchpriority="high" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #064e3b;
      font-family: 'Inter', system-ui, sans-serif;
    }

    #initial-loader {
      position: fixed;
      inset: 0;
      background: #064e3b;
      z-index: 999999;
      font-family: 'Inter', system-ui, sans-serif;
      overflow: hidden;
      opacity: 1;
      transition: opacity 0.35s ease-out;
    }

    @media all and (display-mode: standalone) {
      #initial-loader {
        display: none !important;
      }
    }

    .loader-bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
    }

    .loader-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.05) 0%, transparent 25%, transparent 75%, rgba(0, 0, 0, 0.12) 100%);
      pointer-events: none;
    }

    .loader-spinner-fixed {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      width: 44px;
      height: 44px;
    }

    .cog-spinner {
      position: relative;
      width: 100%;
      height: 100%;
      animation: cog-rotate 6s linear infinite;
    }

    .cog-bar {
      position: absolute;
      top: 0;
      left: 50%;
      width: 3px;
      height: 11px;
      margin-left: -1.5px;
      border-radius: 999px;
      background: #ffffff;
      transform-origin: 1.5px 22px;
      animation: cog-fade 1.2s linear infinite;
    }

    .cog-bar:nth-child(1)  { transform: rotate(0deg);   animation-delay: -1.1s; }
    .cog-bar:nth-child(2)  { transform: rotate(30deg);  animation-delay: -1.0s; }
    .cog-bar:nth-child(3)  { transform: rotate(60deg);  animation-delay: -0.9s; }
    .cog-bar:nth-child(4)  { transform: rotate(90deg);  animation-delay: -0.8s; }
    .cog-bar:nth-child(5)  { transform: rotate(120deg); animation-delay: -0.7s; }
    .cog-bar:nth-child(6)  { transform: rotate(150deg); animation-delay: -0.6s; }
    .cog-bar:nth-child(7)  { transform: rotate(180deg); animation-delay: -0.5s; }
    .cog-bar:nth-child(8)  { transform: rotate(210deg); animation-delay: -0.4s; }
    .cog-bar:nth-child(9)  { transform: rotate(240deg); animation-delay: -0.3s; }
    .cog-bar:nth-child(10) { transform: rotate(270deg); animation-delay: -0.2s; }
    .cog-bar:nth-child(11) { transform: rotate(300deg); animation-delay: -0.1s; }
    .cog-bar:nth-child(12) { transform: rotate(330deg); animation-delay:  0.0s; }

    .loader-bottom-content {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 16px) + 44px);
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 24px;
      gap: 6px;
    }

    .loader-status-text {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin: 0;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.4);
    }

    .loader-tagline {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.88);
      letter-spacing: 0.06em;
      margin: 0;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.45);
    }

    @keyframes cog-fade {
      0%, 100% {
        opacity: 1;
        height: 12px;
      }
      50% {
        opacity: 0.2;
        height: 8px;
      }
    }

    @keyframes cog-rotate {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
  <title>Klinflow Client</title>
</head>

<body class="font-sans antialiased bg-slate-50 text-slate-900 dark:bg-slate-800 dark:text-slate-100">
  <div id="initial-loader">
    <img src="/welcome/loading.webp" alt="Klinflow" class="loader-bg-image" fetchpriority="high" decoding="sync" />
    <div class="loader-scrim"></div>

    <div class="loader-spinner-fixed" aria-label="Loading">
      <div class="cog-spinner">
        <span class="cog-bar"></span><span class="cog-bar"></span><span class="cog-bar"></span>
        <span class="cog-bar"></span><span class="cog-bar"></span><span class="cog-bar"></span>
        <span class="cog-bar"></span><span class="cog-bar"></span><span class="cog-bar"></span>
        <span class="cog-bar"></span><span class="cog-bar"></span><span class="cog-bar"></span>
      </div>
    </div>

    <div class="loader-bottom-content">
      <p class="loader-status-text">Loading</p>
      <p class="loader-tagline">Connect · Collect · Earn</p>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
